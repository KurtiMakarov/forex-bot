app:
  name: "Stocks Trading AI"
  version: "4.2.0"
  debug: false

broker:
  # paper_trader | ibkr
  type: "paper_trader"
  mode: "paper"                    # paper | live
  allow_live_trading: false
  ib_host: "127.0.0.1"
  ib_port: 7497
  ib_client_id: 1

data:
  supported_pairs:
    - "AAPL"
    - "MSFT"
    - "GOOGL"
    - "TSLA"
    - "NVDA"
    - "AMZN"
    - "META"
    - "JPM"
    - "V"
    - "JNJ"
    - "UNH"
    - "XOM"
    - "CVX"
  historical_days: 100

trading:
  risk_per_trade: 0.005            # 0.5%
  max_daily_loss: 0.02             # 2%
  max_position_pct: 0.05           # max 5% of balance in one position
  min_confidence: 0.65
  max_open_positions: 5
  kill_switch_on_daily_loss: true
  scan_interval_seconds: 60
  journal_path: "journal/trades.jsonl"
  block_orders_when_market_closed: true

telegram:
  token: "${TELEGRAM_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

api_keys:
  news_api: "${NEWS_API_KEY}"
  alpha_vantage: "${ALPHA_VANTAGE_KEY}"

strategies:
  enabled:
    - "trend_following"
    - "mean_reversion"
    - "breakout"
  weights:
    trend_following: 0.4
    mean_reversion: 0.3
    breakout: 0.3